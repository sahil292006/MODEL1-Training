<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shop Opening Invitation</title>
    <style>
        body {
            background-color: #f5f0e8;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding: 30px;
        }

        .card {
            background-color: white;
            width: 600px;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        .header {
            background-color: #c8a951;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 28px;
            margin: 0 0 8px 0;
        }

        .header p {
            margin: 0;
            font-size: 15px;
        }

        .section {
            margin: 20px 0;
        }

        .section-title {
            font-size: 13px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .details {
            list-style: none;
            padding: 0;
            font-size: 15px;
            color: #444;
            line-height: 2.2;
            text-align: left;
        }

        video {
            width: 100%;
            border-radius: 10px;
        }

        audio {
            width: 100%;
        }

        iframe {
            width: 100%;
            height: 250px;
            border: none;
            border-radius: 10px;
        }

        .rsvp-btn {
            background-color: #c8a951;
            color: white;
            border: none;
            padding: 13px 40px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }

        .rsvp-btn:hover {
            background-color: #b8941e;
        }

        hr {





            border: none;
            border-top: 1px solid #eee;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="card">

        <div class="header">
            <h1>🎉 Grand Opening!</h1>
            <p>You are invited to our shop opening</p>
        </div>

        <div class="section">
            <p class="section-title">Event Details</p>
            <ul class="details">
                <li>🏪 <strong>Shop Name:</strong> Royal Collections</li>
                <li>📅 <strong>Date:</strong> Saturday, June 1, 2025</li>
                <li>🕐 <strong>Time:</strong> 11:00 AM Onwards</li>
                <li>📍 <strong>Address:</strong> 12 Main Street, Ahmedabad</li>
                <li>📞 <strong>Contact:</strong> +91 98765 43210</li>
            </ul>
        </div>

        <hr>

        <div class="section">
            <p class="section-title">Watch Our Shop Video</p>
            <video controls>
                <source src="shop-video.mp4" type="video/mp4">
            </video>
        </div>

        <hr>

        <div class="section">
            <p class="section-title">🎵 Celebration Music</p>
            <audio controls>
                <source src="music.mp3" type="audio/mpeg">
            </audio>
        </div>

        <hr>

        <div class="section">
            <p class="section-title">📍 Our Location</p>
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d235013.68!2d72.41492!3d23.02052!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x395e848aba5bd449%3A0x4fcedd11614f6516!2sAhmedabad%2C%20Gujarat!5e0!3m2!1sen!2sin!4v1716000000000" allowfullscreen loading="lazy"></iframe>
        </div>

        <hr>

        <div class="section">
            <button class="rsvp-btn">✅ I Will Attend</button>
        </div>

    </div>

</body>
</html>
