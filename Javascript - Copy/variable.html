<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variable</title>
</head>
<body>
    <h1>This is showing how variable is working in javascript</h1>
    <p>press f12 in keyboard to see the output</p>
    <script>
    const PI=3.14159;
    console.log("value of pi is: "+PI);

    var x=10;
    x=x+20;
    console.log("Value of x is: "+x);

    let t=50;
    t=t/5;
    console.log("Value of t is: "+ t);

</script>

    
</body>
</html>
