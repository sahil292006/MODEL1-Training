<html>
    <head>
        <title>
            Student Registration Form
        </title>
    </head>
    <body>
        <center>

        <center>
        <h1>Student Registration Form</h1>
        </center>
        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            <br><br>
            <label for="Enrollment">Enrollment:</label>


            <input type="text" id="Enrollment" name="Enrollment" required>
            <br><br>
            <label for="Branch">Branch:</label>
            <select id = "Branch ">
                <option value="CSE">CSE</option>
                <option value="CE">CE</option>
                <option value="IT">IT</option>
            </select>
            <br><br>
            <label for="division">division:</label>
            <input type="text" id="division" name="division" required  maxlength="1"            pattern="[a-zA-Z]">
            <br><br>
            <label for="Gender">Gender:</label>
            <input type ="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type ="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
            <br><br>
            <label for="mobile">Mobile Number:</label>
            <input type="tel" id="mobile" name="mobile" required  maxlength="10" pattern="[0-9]{10}">
            <br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br><br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <br><br>
            <label for="photo">Photo:</label>
            <input type ="file" id="photo" name="photo" accept="image/*">
            <br><br>

            <label for="remarks">Remarks:</label>
           <textarea id="remarks" placeholder="Write any remarks..."></textarea>
            <br><br>

            <input type="submit" value="Register">
            <input type="reset" value="Clear">
        </form>
        </center>
    </body>
</html>
