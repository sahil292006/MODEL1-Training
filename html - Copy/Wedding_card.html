<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Wedding Invitation</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <audio autoplay loop>
        <source src="background-music.mp3" type="audio/mpeg">
    </audio>

    <main class="desktop-wrapper">
        <div class="card-container">
            
            <header class="hero">
                <video autoplay muted loop id="bg-video">
                    <source src="140666-775595959_medium.mp4" type="video/mp4">
                </video>
                <div class="overlay-text">
                    <h1>Sarah <span class="and-divider">&</span> James</h1>
                    <p>Are getting married</p>
                </div>
            </header>

            
            <section class="details">
                <div class="content-padding">
                    <h2>Save the Date</h2>
                    <p class="date">October 24, 2026</p>
                    <p class="time">at 4:00 PM</p>
                    <hr>
                    <p class="venue">The Grand Willow Estate</p>
                    
                    <section class="map-section">
                        <h3>Find the Way</h3>
                        <div class="map-container">
                            <iframe src="https://www.google.com/maps/embed?pb=!1m18..." width="100%" height="200" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
                        </div>
                    </section>

                    <section class="final-invite">
                        <h2 class="excitement-text">We can't wait to celebrate with you!</h2>
                        <div class="button-container">
                            <a href="#" class="main-rsvp-btn">Confirm Your Presence</a>
                        </div>
                        <footer class="invitation-footer">
                            <p>With love, Sarah & James</p>
                        </footer>
                    </section>
                </div> 
            </section> 
        </div> 
    </main>
</body>
</html>
