    <title>Advanced Meta Tag Configuration</title>
    <meta name="description" content="A complete demonstration of HTML meta tags including refresh and security headers.">

    <meta property="og:site_name" content="Meta Master">

    <meta name="theme-color" content="#317EFB"> <!-- Changes browser toolbar color on mobile -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">

<body>
    <h2>Meta Refresh Active</h2>
