<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master UI Effects - Final Fix</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: #000; color: white; overflow-x: hidden; }

    
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .bg-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover; 
      z-index: -2;
      opacity: 0.7;
    }

    
    .glass-form {
      position: relative;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      padding: 40px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      width: 400px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      text-align: center;
    }

    .glass-form h2 { margin-bottom: 30px; font-size: 2rem; }

    .input-group {
      position: relative;
      margin-bottom: 25px;
    }

    .input-group i {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #00d2ff;
      font-size: 1.2rem;
    }

    .input-group input {
      width: 100%;
      padding: 15px 15px 15px 45px;
      background: rgba(255, 255, 255, 0.15);
      border: none;
      border-radius: 10px;
      color: white;
      outline: none;
      transition: 0.3s;
    }

    .input-group input:focus { background: rgba(255, 255, 255, 0.25); box-shadow: 0 0 10px #00d2ff; }

    .btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(45deg, #00d2ff, #3a47d5);
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover { transform: scale(1.02); filter: brightness(1.1); }

  
    .parallax-section {
      height: 80vh;
      background-image: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1920&q=80');
      background-attachment: fixed; /* THE KEY TO PARALLAX */
      background-position: center;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .parallax-section h2 { font-size: 4rem; text-transform: uppercase; letter-spacing: 5px; }

    
    .gallery {
      background: #050505;
      padding: 80px 5%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 30px;
    }

    .card {
      position: relative;
      height: 400px;
      border-radius: 20px;
      overflow: hidden;
      cursor: pointer;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: 0.6s ease;
    }

    .card:hover img { transform: scale(1.1) rotate(2deg); filter: brightness(0.6); }

    .card-content {
      position: absolute;
      bottom: -100%;
      left: 0;
      width: 100%;
      padding: 30px;
      background: linear-gradient(transparent, rgba(0,0,0,0.9));
      transition: 0.5s ease;
    }

    .card:hover .card-content { bottom: 0; }
  </style>
</head>
<body>

  <section class="hero">
    <video autoplay muted loop playsinline class="bg-video">
      <source src="https://videos.pexels.com/video-files/3209211/3209211-uhd_2560_1440_25fps.mp4" type="video/mp4">
    </video>

    <div class="glass-form">
      <h2>Welcome Back</h2>
      <div class="input-group">
        <i class="fa-solid fa-user"></i>
        <input type="text" placeholder="Username">
      </div>
      <div class="input-group">
        <i class="fa-solid fa-envelope"></i>
        <input type="email" placeholder="Email">
      </div>
      <button class="btn">Join Now</button>
    </div>
  </section>

  <div class="parallax-section">
    <h2>Explore Nature</h2>
  </div>

  <section class="gallery">
    <div class="card">
      <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=800" alt="Mountain">
      <div class="card-content">
        <h3>Mountain peaks</h3>
        <p>Experience the height of nature.</p>
      </div>
    </div>
    <div class="card">
      <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=800" alt="Valley">
      <div class="card-content">
        <h3>Lush Valleys</h3>
        <p>Greenery that touches the soul.</p>
      </div>
    </div>
    <div class="card">
      <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800" alt="Forest">
      <div class="card-content">
        <h3>Ancient Forests</h3>
        <p>Walk through the history of trees.</p>
      </div>
    </div>
  </section>

</body>
</html>
